[project]
name = "leo"
version = "0.1.0"
description = "Korea Legal Opportunity Engine: L0 pipeline (collect, normalize, link, batch handoff, verify)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "defusedxml>=0.7",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leo = "leo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
