name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kloe
          POSTGRES_PASSWORD: kloe
          POSTGRES_DB: kloe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kloe" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # DB 테스트는 이 DB의 public 스키마를 지우고 다시 만든다 (CI 전용 컨테이너)
      KLOE_TEST_DATABASE_URL: postgresql://kloe:kloe@localhost:5432/kloe_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
